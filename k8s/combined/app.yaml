apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-frontend-config
  labels:
    app: admin-frontend
  namespace: default
data:
  PORT: "3001"
  VITE_API_URL: "http://127.0.0.1:57826/api"
---
apiVersion: v1
kind: Secret
metadata:
  name: admin-frontend-secrets
  labels:
    app: admin-frontend
  namespace: default
type: Opaque
stringData:
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-frontend-deployment
  labels:
    app: admin-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-frontend
  template:
    metadata:
      labels:
        app: admin-frontend
    spec:
      containers:
        - name: admin-frontend
          image: admin-starter-app-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: admin-frontend-config
            - secretRef:
                name: admin-frontend-secrets
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: admin-frontend-service
  labels:
    app: admin-frontend
  namespace: default
spec:
  type: NodePort
  selector:
    app: admin-frontend
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      protocol: TCP
      nodePort: 30082
